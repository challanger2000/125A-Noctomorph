name: Windows VST3 - manual
# Manual builds, except exactly one CI screenshot test branch. No other push/PR runs.
on:
  workflow_dispatch:
  push:
    branches:
      - ci/gui-render-20261029

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout 125A development sources
        uses: actions/checkout@v4

      # The 125A repo holds editable C++/Projucer sources.
      # Large factory presets, waves and legacy artwork are fetched
      # from immutable upstream V4JB 0.0.4 for an exact baseline.
      - name: Checkout pinned V4JB assets
        uses: actions/checkout@v4
        with:
          repository: iamtew/V4JB
          ref: 2b3bc12400ad3337ba6d8f2e37dc61672c39b951
          path: _upstream

      - name: Checkout pinned JUCE 9.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 9.0.4
          path: JUCE

      - name: Restore unmodified upstream binary assets and factory presets
        shell: pwsh
        run: |
          if (Test-Path presets) { throw 'presets directory unexpectedly exists; explicit merge policy required' }
          if (-not (Test-Path assets/logo.svg)) { throw 'Missing authoritative 125A SVG from branch' }
          Copy-Item _upstream/presets presets -Recurse
          Copy-Item _upstream/assets/logo.png assets/logo.png -Force
          if (-not (Test-Path presets/waves/vowels.wav)) { throw 'Missing pinned factory waves' }
          if (-not (Test-Path assets/logo.png)) { throw 'Missing pinned original icon resource' }

      - name: Point Projucer at pinned JUCE modules
        shell: pwsh
        run: |
          $jucer = Join-Path (Get-Location) 'V4JB.jucer'
          $old = 'C:\Users\Mikael\JUCE\modules'
          $modules = (Resolve-Path 'JUCE/modules').Path
          $source = [System.IO.File]::ReadAllText($jucer)
          $updated = $source.Replace($old, $modules)
          if ($source -eq $updated) { throw 'Original Projucer JUCE paths were not found' }
          [System.IO.File]::WriteAllText($jucer, $updated, [System.Text.UTF8Encoding]::new($false))

      - name: Build JUCE Projucer and regenerate Visual Studio solution
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild 'JUCE/extras/Projucer/Builds/VisualStudio2022/Projucer.sln' /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $projucer = 'JUCE/extras/Projucer/Builds/VisualStudio2022/x64/Release/App/Projucer.exe'
          if (-not (Test-Path $projucer)) { throw 'Projucer executable not found' }
          & $projucer --resave V4JB.jucer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile original DSP self-test
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'VC environment not found' }
          cmd /c "call `"$vcvars`" >nul && cl /nologo /EHsc /std:c++17 /O2 /Isrc tests\engine_check.cpp /Fe:engine_check.exe && engine_check.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile VST3 x64 Release
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild 'Builds/VisualStudio2022/V4JB.sln' /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render actual JUCE editor screenshots (Windows Standalone, VST3-size)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path Builds/VisualStudio2022 -Recurse -Filter V4JB.exe -File |
            Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'Standalone V4JB.exe not found; cannot render actual editor' }
          $env:V4JB_CAPTURE_GUI_DIR = Join-Path (Get-Location) 'screenshots'
          New-Item -ItemType Directory -Force $env:V4JB_CAPTURE_GUI_DIR | Out-Null
          $process = Start-Process -FilePath $exe.FullName -PassThru
          try {
            $required = @('01-play.png', '02-source.png', '03-effects.png',
                          '04-modules-05-07.png', '05-modules-08-10.png',
                          '06-modules-11.png', '07-morph.png',
                          '08-modulation.png', '09-waves.png')
            for ($i = 0; $i -lt 100; $i++) {
              Start-Sleep -Milliseconds 500
              $found = @($required | Where-Object { Test-Path (Join-Path $env:V4JB_CAPTURE_GUI_DIR $_) })
              if ($found.Count -eq $required.Count) { break }
              if ($process.HasExited) { throw "Standalone closed before rendering GUI" }
            }
            foreach ($name in $required) {
              $file = Join-Path $env:V4JB_CAPTURE_GUI_DIR $name
              if (-not (Test-Path $file)) { throw "Missing real Windows GUI image: $name" }
              if ((Get-Item $file).Length -lt 4096) { throw "PNG appears empty: $name" }
              Write-Host "$name : $((Get-Item $file).Length) bytes"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Package Windows VST3
        if: always()
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path Builds/VisualStudio2022 -Recurse -Directory -Filter V4JB.vst3 |
            Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $vst) { throw 'Compiled VST3 not found' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $vst.FullName -DestinationPath 'dist/V4JB-0.0.4-125A-GUI-TEST-win-x64-vst3.zip' -Force

      - name: Upload genuine render and experimental VST3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Noctomorph-GUI-render-Windows
          path: |
            screenshots/*.png
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
