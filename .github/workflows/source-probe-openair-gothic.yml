name: Noctomorph OpenAIR Gothic Space Probe

on:
  workflow_dispatch:

jobs:
  # Gothic/stone-space B-format production candidates.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install -r tools/requirements-audio.txt

      - name: Download OpenAIR B-format originals
        run: |
          mkdir -p external/openair-gothic measurements/openair-gothic
          curl -L --fail --retry 3 "https://webfiles.york.ac.uk/OPENAIR/IRs/maes-howe/b-format/mh3_000_bformat_48k.wav" -o external/openair-gothic/maes-howe-bformat.wav
          curl -L --fail --retry 3 "https://webfiles.york.ac.uk/OPENAIR/IRs/hamilton-mausoleum/b-format/hm2_000_bformat_48k.wav" -o external/openair-gothic/hamilton-mausoleum-bformat.wav

      - name: Measure Maes Howe Tomb
        run: python tools/analyze_audio.py external/openair-gothic/maes-howe-bformat.wav --ir --json measurements/openair-gothic/DATA-IR-006.json

      - name: Measure Hamilton Mausoleum
        run: python tools/analyze_audio.py external/openair-gothic/hamilton-mausoleum-bformat.wav --ir --json measurements/openair-gothic/DATA-IR-007.json

      - name: Upload measurements only
        uses: actions/upload-artifact@v4
        with:
          name: noctomorph-openair-gothic-measurements
          path: measurements/openair-gothic/*.json
          if-no-files-found: error
