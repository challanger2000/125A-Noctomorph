name: Noctomorph Archetype Listening QA

on:
  push:
    branches: [dev/prototype-v0.1]
    paths:
      - ".github/workflows/archetype-listening.yml"
      - "tools/render_real_sources.cpp"
      - "tools/apply_ir.py"
      - "tools/prepare_audio_raw.py"
      - "tools/analyze_audio.py"
      - "tools/requirements-audio.txt"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install -r tools/requirements-audio.txt

      - name: Download controlled raw sources and measured spaces
        run: |
          mkdir -p external/archetypes raw renders measurements/archetypes
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20PaperMachinePM4.ogg" -o external/archetypes/world.ogg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20Automaticpackingstation.ogg" -o external/archetypes/texture.ogg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Gong%20or%20bell%20vibrant%20(short).ogg" -o external/archetypes/body.ogg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/200437%20bigben12345%20petersglocke.oga" -o external/archetypes/event.oga
          curl -L --fail --retry 3 "https://webfiles.york.ac.uk/OPENAIR/IRs/maes-howe/b-format/mh3_000_bformat_48k.wav" -o external/archetypes/maes-howe.wav
          curl -L --fail --retry 3 "https://webfiles.york.ac.uk/OPENAIR/IRs/hamilton-mausoleum/b-format/hm2_000_bformat_48k.wav" -o external/archetypes/hamilton.wav
          curl -L --fail --retry 3 "https://webfiles.york.ac.uk/OPENAIR/IRs/r1-nuclear-reactor-hall/examples/r1_omni_48k.wav" -o external/archetypes/r1.wav
          curl -L --fail --retry 3 "https://webfiles.york.ac.uk/OPENAIR/IRs/terrys-factory-warehouse/mono/terrys_warehouse_omni.wav" -o external/archetypes/terry.wav

      - name: Prepare source buffers
        run: |
          python tools/prepare_audio_raw.py external/archetypes/world.ogg raw/world.raw --peak 0.40
          python tools/prepare_audio_raw.py external/archetypes/texture.ogg raw/texture.raw --peak 0.30
          python tools/prepare_audio_raw.py external/archetypes/body.ogg raw/body.raw --peak 0.26
          python tools/prepare_audio_raw.py external/archetypes/event.oga raw/event.raw --peak 0.32

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Render six dry engine archetypes
        run: |
          for profile in industrial ruins nocturne abyss wasteland void; do
            ./build/noctomorph_real_source_render raw/world.raw raw/texture.raw raw/body.raw raw/event.raw 120 "renders/${profile}-engine.wav" "${profile}"
          done

      - name: Apply measured spaces
        run: |
          python tools/apply_ir.py renders/industrial-engine.wav external/archetypes/r1.wav renders/industrial-final.wav --wet 0.42 --tail-seconds 8
          python tools/apply_ir.py renders/ruins-engine.wav external/archetypes/maes-howe.wav renders/ruins-final.wav --wet 0.62 --tail-seconds 5 --bformat-stereo
          python tools/apply_ir.py renders/nocturne-engine.wav external/archetypes/hamilton.wav renders/nocturne-final.wav --wet 0.68 --tail-seconds 15 --bformat-stereo
          python tools/apply_ir.py renders/abyss-engine.wav external/archetypes/hamilton.wav renders/abyss-final.wav --wet 0.52 --tail-seconds 15 --bformat-stereo
          python tools/apply_ir.py renders/wasteland-engine.wav external/archetypes/terry.wav renders/wasteland-final.wav --wet 0.38 --tail-seconds 20
          python tools/apply_ir.py renders/void-engine.wav external/archetypes/hamilton.wav renders/void-final.wav --wet 0.78 --tail-seconds 15 --bformat-stereo

      - name: Measure six archetypes
        run: |
          for profile in industrial ruins nocturne abyss wasteland void; do
            python tools/analyze_audio.py "renders/${profile}-final.wav" --json "measurements/archetypes/${profile}.json"
          done

      - name: Upload listening pack
        uses: actions/upload-artifact@v4
        with:
          name: noctomorph-archetype-listening-pack
          path: |
            renders/*-final.wav
            measurements/archetypes/*.json
          if-no-files-found: error
