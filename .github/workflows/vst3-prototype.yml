name: Noctomorph VST3 Prototype

on:
  push:
    branches:
      - dev/prototype-v0.1
    paths:
      - ".github/workflows/vst3-prototype.yml"
      - "CMakeLists.txt"
      - "source/**"
      - "include/**"
      - "src/**"
  workflow_dispatch:

jobs:
  # Asset-enabled wrapper/validator/state/process gate; no GUI yet.
  windows-vst3:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset preparation dependencies
        shell: pwsh
        run: python -m pip install -r tools/requirements-audio.txt

      - name: Download cleared production-source candidates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path external-assets, prepared-assets, generated-assets | Out-Null
          curl.exe -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20PaperMachinePM4.ogg" -o external-assets/world.ogg
          curl.exe -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20Automaticpackingstation.ogg" -o external-assets/texture.ogg
          curl.exe -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Ticking%20glass.ogg" -o external-assets/body-bright.ogg
          curl.exe -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Gong%20or%20bell%20vibrant%20(short).ogg" -o external-assets/body-deep.ogg
          curl.exe -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/200437%20bigben12345%20petersglocke.oga" -o external-assets/event.oga

      - name: Prepare deterministic embedded asset subset
        shell: pwsh
        run: |
          python tools/prepare_prototype_assets.py --world external-assets/world.ogg --texture external-assets/texture.ogg --body-bright external-assets/body-bright.ogg --body-deep external-assets/body-deep.ogg --event external-assets/event.oga --out prepared-assets
          python tools/generate_noctomorph_resources.py prepared-assets generated-assets
          Get-ChildItem prepared-assets
          Get-ChildItem generated-assets

      - name: Configure VST3 prototype
        shell: pwsh
        run: |
          cmake --version
          $generated = (Resolve-Path generated-assets).Path
          cmake -S . -B build-vst3 -G "Visual Studio 18 2026" -A x64 -DNOCTOMORPH_BUILD_VST3=ON "-DNOCTOMORPH_GENERATED_ASSET_DIR=$generated"

      - name: Build plugin core tests and validator
        shell: pwsh
        run: |
          cmake --build build-vst3 --config Release --target Noctomorph noctomorph_core_tests noctomorph_state_recall_probe noctomorph_process_contract_probe validator --parallel 2

      - name: Run core regression tests
        shell: pwsh
        run: |
          ctest --test-dir build-vst3 -C Release -R noctomorph_core_tests --output-on-failure

      - name: Install third-party attribution in bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build-vst3 -Recurse -Directory -Filter "Noctomorph.vst3" | Select-Object -First 1
          if (-not $plugin) { Write-Error "Noctomorph.vst3 not found"; exit 1 }
          $resources = Join-Path $plugin.FullName "Contents\Resources"
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          Copy-Item resource/THIRD-PARTY-AUDIO-LICENSES.txt (Join-Path $resources "THIRD-PARTY-AUDIO-LICENSES.txt") -Force
          if (-not (Test-Path (Join-Path $resources "THIRD-PARTY-AUDIO-LICENSES.txt"))) {
            Write-Error "Third-party attribution missing from VST3 bundle"
            exit 1
          }

      - name: Run state recall and process contract probes
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build-vst3 -Recurse -Directory -Filter "Noctomorph.vst3" | Select-Object -First 1
          $state = Get-ChildItem -Path build-vst3 -Recurse -File -Filter "noctomorph_state_recall_probe.exe" | Select-Object -First 1
          $process = Get-ChildItem -Path build-vst3 -Recurse -File -Filter "noctomorph_process_contract_probe.exe" | Select-Object -First 1
          if (-not $plugin -or -not $state -or -not $process) { Write-Error "VST3 probe artifact missing"; exit 1 }
          & $state.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $process.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate and validate prototype VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build-vst3 -Recurse -Directory -Filter "Noctomorph.vst3" | Select-Object -First 1
          $validator = Get-ChildItem -Path build-vst3 -Recurse -File -Filter "validator.exe" | Select-Object -First 1
          if (-not $plugin) { Write-Error "Noctomorph.vst3 not found"; exit 1 }
          if (-not $validator) { Write-Error "validator.exe not found"; exit 1 }
          Write-Host "Plugin: $($plugin.FullName)"
          Write-Host "Validator: $($validator.FullName)"
          & $validator.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload prototype VST3
        uses: actions/upload-artifact@v4
        with:
          name: noctomorph-vst3-prototype
          path: build-vst3/**/*.vst3/**
          if-no-files-found: error
          retention-days: 7
