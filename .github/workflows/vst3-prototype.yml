name: Noctomorph VST3 Prototype

on:
  push:
    branches:
      - dev/prototype-v0.1
    paths:
      - ".github/workflows/vst3-prototype.yml"
      - "CMakeLists.txt"
      - "source/**"
      - "include/**"
      - "src/**"
  workflow_dispatch:

concurrency:
  group: noctomorph-vst3-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset preparation dependencies
        run: python -m pip install -r tools/requirements-audio.txt

      - name: Download cleared production-source candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-assets prepared-assets

          get_asset() {
            local url="$1"
            local out="$2"
            echo "Downloading $out"
            local ok=0
            for attempt in 1 2 3 4 5 6; do
              if curl -A "125A-Noctomorph/0.2 (research build; github.com/challanger2000)" \
                -L --fail --connect-timeout 20 --max-time 240 \
                "$url" -o "$out"; then
                ok=1
                break
              fi
              rm -f "$out"
              # Back off hard on 429/temporary CDN failures.
              sleep $((attempt * 20))
            done
            if [ "$ok" -ne 1 ] || [ ! -s "$out" ]; then
              echo "Asset download failed: $url" >&2
              exit 1
            fi
            # Wikimedia aggressively rate-limits shared CI runner IPs. Keep
            # acquisition deliberately slow; Actions time is cheaper than
            # repeated failed full runs and this path is not realtime-critical.
            sleep 12
          }

          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20PaperMachinePM4.ogg" "external-assets/world_paper.ogg"
          get_asset "https://upload.wikimedia.org/wikipedia/commons/1/18/WWS_Eccentricpress.ogg" "external-assets/world_eccentric.ogg"
          get_asset "https://upload.wikimedia.org/wikipedia/commons/3/31/WWS_Fencemakingmachine.ogg" "external-assets/world_fence.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20Automaticpackingstation.ogg" "external-assets/texture_packing.ogg"
          get_asset "https://upload.wikimedia.org/wikipedia/commons/d/d5/WWS_Sawbladesharpeningmachine.ogg" "external-assets/texture_saw.ogg"
          get_asset "https://upload.wikimedia.org/wikipedia/commons/9/96/Scrubbing_with_small_metal_bristled_brush.ogg" "external-assets/texture_brush.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/Howling%20wind.ogg" "external-assets/world_wind.ogg"
          get_asset "https://upload.wikimedia.org/wikipedia/commons/e/ea/Ambient_Noise.ogg" "external-assets/world_ambient.ogg"
          get_asset "https://upload.wikimedia.org/wikipedia/commons/f/f2/Russian_Orthodox_Christmas_Church_singing_1.ogg" "external-assets/texture_choir.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/Ticking%20glass.ogg" "external-assets/body_glass.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/Gong%20or%20bell%20vibrant%20(short).ogg" "external-assets/body_gong.ogg"
          get_asset "https://upload.wikimedia.org/wikipedia/commons/0/04/Open_metallic_door.ogg" "external-assets/event_metaldoor.ogg"
          get_asset "https://upload.wikimedia.org/wikipedia/commons/2/23/Metal_cabinet_door_jarring.ogg" "external-assets/event_cabinet.ogg"
          get_asset "https://upload.wikimedia.org/wikipedia/commons/5/5b/Dull_thud.ogg" "external-assets/event_thud.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/200437%20bigben12345%20petersglocke.oga" "external-assets/event_peters.oga"

          # Production-bank expansion: physically different source families.
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20Steamwindingengineconnectingrod.ogg" "external-assets/world_steamrod.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20Pneumaticpump.ogg" "external-assets/world_pneumatic.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20Waterintakepumpingstation.ogg" "external-assets/world_waterpump.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20Horizontalmillingmachinebeltdrive.ogg" "external-assets/texture_millbelt.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20SteelworkCoiler.ogg" "external-assets/texture_steelcoiler.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/Chisel.1st.ogg" "external-assets/texture_chisel.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/WWS%20Planingmachine.ogg" "external-assets/texture_planer.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/Door%20handle%20creaking.ogg" "external-assets/event_handlecreak.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/Squeaky%20door%20hinge.ogg" "external-assets/event_hinge.ogg"
          get_asset "https://commons.wikimedia.org/wiki/Special:Redirect/file/Metal%20drop%20thump.ogg" "external-assets/event_metalthump.ogg"

      - name: Prepare deterministic v0.2 scene bank
        run: |
          python tools/prepare_prototype_assets.py --input-dir external-assets --out prepared-assets
          find prepared-assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test "$(find prepared-assets -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 25

      - name: Upload prepared scene bank
        uses: actions/upload-artifact@v4
        with:
          name: noctomorph-prepared-scene-bank
          path: prepared-assets/*.wav
          if-no-files-found: error
          retention-days: 1

  windows-vst3:
    needs: prepare-assets
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download prepared scene bank
        uses: actions/download-artifact@v4
        with:
          name: noctomorph-prepared-scene-bank
          path: prepared-assets

      - name: Generate Windows embedded resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path generated-assets | Out-Null
          python tools/generate_noctomorph_resources.py prepared-assets generated-assets
          Get-ChildItem prepared-assets
          Get-ChildItem generated-assets

      - name: Configure VST3 prototype
        shell: pwsh
        run: |
          cmake --version
          $generated = (Resolve-Path generated-assets).Path
          cmake -S . -B build-vst3 -G "Visual Studio 18 2026" -A x64 -DNOCTOMORPH_BUILD_VST3=ON "-DNOCTOMORPH_GENERATED_ASSET_DIR=$generated"

      - name: Build plugin core tests and validator
        shell: pwsh
        run: |
          cmake --build build-vst3 --config Release --target Noctomorph noctomorph_core_tests noctomorph_state_recall_probe noctomorph_process_contract_probe validator --parallel 2

      - name: Run core regression tests
        shell: pwsh
        run: |
          ctest --test-dir build-vst3 -C Release -R noctomorph_core_tests --output-on-failure

      - name: Install third-party attribution in bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build-vst3 -Recurse -Directory -Filter "Noctomorph.vst3" | Select-Object -First 1
          if (-not $plugin) { Write-Error "Noctomorph.vst3 not found"; exit 1 }
          $resources = Join-Path $plugin.FullName "Contents\Resources"
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          Copy-Item resource/THIRD-PARTY-AUDIO-LICENSES.txt (Join-Path $resources "THIRD-PARTY-AUDIO-LICENSES.txt") -Force
          if (-not (Test-Path (Join-Path $resources "THIRD-PARTY-AUDIO-LICENSES.txt"))) {
            Write-Error "Third-party attribution missing from VST3 bundle"
            exit 1
          }

      - name: Run state recall and process contract probes
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build-vst3 -Recurse -Directory -Filter "Noctomorph.vst3" | Select-Object -First 1
          $state = Get-ChildItem -Path build-vst3 -Recurse -File -Filter "noctomorph_state_recall_probe.exe" | Select-Object -First 1
          $process = Get-ChildItem -Path build-vst3 -Recurse -File -Filter "noctomorph_process_contract_probe.exe" | Select-Object -First 1
          if (-not $plugin -or -not $state -or -not $process) { Write-Error "VST3 probe artifact missing"; exit 1 }
          & $state.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $process.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate and validate prototype VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build-vst3 -Recurse -Directory -Filter "Noctomorph.vst3" | Select-Object -First 1
          $validator = Get-ChildItem -Path build-vst3 -Recurse -File -Filter "validator.exe" | Select-Object -First 1
          if (-not $plugin) { Write-Error "Noctomorph.vst3 not found"; exit 1 }
          if (-not $validator) { Write-Error "validator.exe not found"; exit 1 }
          Write-Host "Plugin: $($plugin.FullName)"
          Write-Host "Validator: $($validator.FullName)"
          & $validator.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload prototype VST3
        uses: actions/upload-artifact@v4
        with:
          name: noctomorph-vst3-prototype
          path: build-vst3/**/*.vst3/**
          if-no-files-found: error
          retention-days: 7
